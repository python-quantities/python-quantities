[project]
name = "quantities"
description = "Support for physical quantities with units, based on numpy"
readme = "README.rst"
requires-python = ">=3.11"
license-files = ["doc/user/license.rst"]
authors = [
  {name = "Darren Dale", email = "dsdale24@gmail.com"}
]
maintainers = [
  {name = "Andrew Davison", email = "andrew.davison@cnrs.fr"}
]
keywords = ["quantities", "units", "physical", "constants"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Topic :: Education",
  "Topic :: Scientific/Engineering"
]
dependencies = [
  "numpy>=2.0"
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
  "pytest",
  "wheel",
  "ruff"
]
doc = [
  "sphinx"
]
scipy = [
  # use the SciPy implementation of the trapezoidal rule
  # for numerical integration,
  "scipy"
]

[project.urls]
documentation = "http://python-quantities.readthedocs.io/"
repository = "https://github.com/python-quantities/python-quantities"
changelog = "https://github.com/python-quantities/python-quantities/blob/master/CHANGES.txt"
download = "http://pypi.python.org/pypi/quantities"

[build-system]
requires = ["setuptools", "setuptools_scm[toml]"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "quantities/_version.py"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, isort.
# Additional rule sets may be enabled over time as the codebase is
# brought into conformance.
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Unit modules deliberately re-export many names; suppress
# "imported but unused" warnings there.
"quantities/units/*.py" = ["F401"]
"quantities/constants/*.py" = ["F401"]
"quantities/__init__.py" = ["F401", "F403"]
